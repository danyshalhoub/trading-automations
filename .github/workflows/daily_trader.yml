name: Daily Paper Trader

on:
  schedule:
    # 9:30 PM UTC = 5:30 PM ET — safely after US market close (4 PM ET)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    # Allows you to trigger a run manually from the GitHub Actions tab

permissions:
  contents: write   # needed so the action can commit positions.json back

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r "Trading Automations/paper_trader/requirements.txt"

      - name: Run trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python "Trading Automations/paper_trader/trader.py"

      - name: Run performance report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python "Trading Automations/paper_trader/performance_report.py"

      - name: Save updated positions and trade log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Trading Automations/paper_trader/positions.json" \
                  "Trading Automations/paper_trader/performance_report.md"
          # trade_log.csv and pending_entries.json only exist once the first
          # trade has closed / the first entry order has ever been submitted
          if [ -f "Trading Automations/paper_trader/trade_log.csv" ]; then
            git add "Trading Automations/paper_trader/trade_log.csv"
          fi
          if [ -f "Trading Automations/paper_trader/pending_entries.json" ]; then
            git add "Trading Automations/paper_trader/pending_entries.json"
          fi

          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # Eastern, not UTC, to match trader.py/performance_report.py's own
          # notion of "today" (see 2026-08-06/07 incident in the directive) -
          # a delayed run crossing UTC midnight shouldn't mislabel the commit
          # a day ahead of the actual US trading day it ran against.
          git commit -m "positions: $(TZ=America/New_York date +'%Y-%m-%d')"

          # A same-day manual push (or an overlapping run) can leave the
          # remote ahead of this checkout. A plain `git push` failing here
          # would silently discard this run's real, already-executed order
          # results (see the 2026-08-05 ACN incident in the directive) — so
          # retry with a rebase instead of giving up on the first rejection.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching and rebasing before retrying."
            git fetch origin
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 attempts — this run's results were NOT saved."
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python "Trading Automations/paper_trader/notify_failure.py"
